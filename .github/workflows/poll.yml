name: bot-tick

# bot_poll.py    — עונה למי ששלח הודעה לבוט
# watch_sheet.py — שולח לוח לערוץ על כל שינוי, ובמועדים 07:30 / 15:30 / 23:30 (שעון ישראל)
#
# cron של GitHub הוא ב-UTC ו"מאמץ מיטבי" (עלול להתעכב). לכן מריצים אשכולות
# ריצות סביב כל מועד — גם ל-IDT (קיץ, UTC+3) וגם ל-IST (חורף, UTC+2) —
# ו-watch_sheet שולח רק פעם אחת לכל מועד (dedupe דרך last_slot).

on:
  schedule:
    # ~07:30 בישראל  (IDT 04:30 UTC / IST 05:30 UTC)
    - cron: "12,27,42,57 4 * * *"
    - cron: "12,27,42,57 5 * * *"
    - cron: "12,27,42 6 * * *"
    # ~15:30 בישראל  (IDT 12:30 UTC / IST 13:30 UTC)
    - cron: "12,27,42,57 12 * * *"
    - cron: "12,27,42,57 13 * * *"
    - cron: "12,27,42 14 * * *"
    # ~23:30 בישראל  (IDT 20:30 UTC / IST 21:30 UTC)
    - cron: "12,27,42,57 20 * * *"
    - cron: "12,27,42,57 21 * * *"
    - cron: "12,27,42 22 * * *"
    # רשת ביטחון כללית — לזיהוי שינויים ולמענה לבקשות לבוט
    - cron: "8,38 * * * *"
  workflow_dispatch:

concurrency:
  group: bot-tick
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: מענה לבקשות "עדכון עכשיו"
        continue-on-error: true
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TZ: Asia/Jerusalem
        run: python bot_poll.py

      - name: בדיקת שינוי בגיליון + מועדי שליחה קבועים
        if: always()
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          TZ: Asia/Jerusalem
          POST_TIMES: ${{ vars.POST_TIMES || '07:30,15:30,23:30' }}
        run: python watch_sheet.py

      - name: שמירת מצב הגיליון
        if: always()
        continue-on-error: true
        run: |
          git add state/
          if git diff --cached --quiet; then
            echo "אין שינוי במצב לשמור" >> "$GITHUB_STEP_SUMMARY"
          else
            git config user.name "sheet-watcher"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "עדכון מצב הגיליון [skip ci]"
            if git push; then
              echo "מצב הגיליון נשמר ב-repo" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "⚠️ שמירת המצב ל-repo נכשלה (הרשאות?). Settings ➜ Actions ➜ General ➜ Workflow permissions ➜ Read and write" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
